<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@SearLV's Defense Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            background-color: #1e1e1e;
            color: #f4f4f4;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #333;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            margin-top: 30px;
        }
        /* ... (keep all your existing styles) ... */
        .when-attacked {
            color: #FFD700;
            font-weight: normal;
        }
        .breakdown {
            display: block;
            font-size: 0.85em;
            color: #aaa;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>@SearLV's Defense Calculator</h1>
        
        <!-- Input fields (unchanged from your original) -->
        <label for="def">Unit's Defense Stat:</label>
        <input type="number" id="def">
        <!-- ... (all other existing inputs) ... -->
        
        <!-- New stacking inputs -->
        <label for="pastSupers">Past Super Attacks (Count):</label>
        <input type="number" id="pastSupers" value="0" min="0">
        
        <label for="teamStacker">Team Stacker's 18Ki SA Buff (%):</label>
        <input type="number" id="teamStacker" value="0">
        
        <label for="teamStackerCount">Team Stacker Supers:</label>
        <input type="number" id="teamStackerCount" value="0" min="0">
        
        <label for="defOnReceiving">Defense when Attacked (%):</label>
        <input type="number" id="defOnReceiving" value="0">
        
        <button id="calculateButton">Calculate</button>
        
        <div id="results">
            <p id="sotDefLabel">SoT Defense: </p>
            <p id="fullBuiltDefLabel">Fully Built-up Defense: </p>
            <div id="superDefPanel"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
