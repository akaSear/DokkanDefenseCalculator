<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@SearLV's Defense Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            background-color: #1e1e1e;
            color: #f4f4f4;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #333;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            margin-top: 30px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }
        input[type="number"], button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #444;
            color: #f4f4f4;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        #results {
            margin-top: 20px;
        }
        #results p {
            margin: 5px 0;
            font-weight: bold;
        }
        /* Minimal addition for "when attacked" text */
        .buff-note {
            color: #FFD700;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>@SearLV's Defense Calculator</h1>

        <!-- Your original inputs -->
        <label for="def">Unit's Defense Stat:</label>
        <input type="number" id="def">
        
        <!-- ... (all your original input fields) ... -->

        <!-- New stacking inputs (minimal additions) -->
        <label for="pastSupers">Past Super Attacks:</label>
        <input type="number" id="pastSupers" value="0" min="0">

        <label for="teamStacker">Team Stacker Buff (%):</label>
        <input type="number" id="teamStacker" value="0">

        <label for="teamStackerCount">Team Stacker Supers:</label>
        <input type="number" id="teamStackerCount" value="0" min="0">

        <label for="defOnReceiving">Defense when Attacked (%):</label>
        <input type="number" id="defOnReceiving" value="0">

        <button id="calculateButton">Calculate</button>

        <div id="results">
            <p id="sotDefLabel">SoT Defense: </p>
            <p id="fullBuiltDefLabel">Fully Built-up Defense: </p>
            <div id="superDefPanel"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
